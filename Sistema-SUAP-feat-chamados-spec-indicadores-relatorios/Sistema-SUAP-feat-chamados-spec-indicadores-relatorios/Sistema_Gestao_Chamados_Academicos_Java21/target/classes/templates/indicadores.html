<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Indicadores</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <header>
    <h1>Indicadores dos Chamados</h1>
    <nav><a href="/chamados">Chamados</a><a href="/relatorios/preview">Relatórios</a>
      <form action="/logout" method="post"><button>Sair</button></form>
    </nav>
  </header>
  <section class="painel">
    <article class="card"><strong>Total</strong>
      <p th:text="${indicadores.total}"></p>
    </article>
    <article class="card"><strong>Abertos</strong>
      <p th:text="${indicadores.abertos}"></p>
    </article>
    <article class="card"><strong>Em análise</strong>
      <p th:text="${indicadores.emAnalise}"></p>
    </article>
    <article class="card"><strong>Concluídos</strong>
      <p th:text="${indicadores.concluidos}"></p>
    </article>
    <article class="card"><strong>Cancelados</strong>
      <p th:text="${indicadores.cancelados}"></p>
    </article>
    <article class="card"><strong>Prioridade alta/urgente</strong>
      <p th:text="${indicadores.altaPrioridade}"></p>
    </article>
  </section>
  <div class="card"><strong>Percentual concluído:</strong> <span
      th:text="${#numbers.formatDecimal(indicadores.percentualConcluido,1,1)} + '%'">0%</span></div>
  <div class="card grafico"><strong>Totais por status</strong>
    <div class="grafico-pizza">
      <canvas id="graficoStatus" width="320" height="320"
        th:attr="data-abertos=${indicadores.abertos},data-emanalise=${indicadores.emAnalise},data-concluidos=${indicadores.concluidos},data-cancelados=${indicadores.cancelados}"></canvas>
      <ul id="legendaStatus" class="legenda"></ul>
    </div>
  </div>
  <div class="card grafico"><strong>Totais por categoria</strong>
    <div class="grafico-pizza">
      <canvas id="graficoCategoria" width="320" height="320"></canvas>
      <ul id="legendaCategoria" class="legenda"></ul>
    </div>
    <!-- Fatias dinamicas: cada categoria vira um item oculto lido pelo JS (sem CDN). -->
    <ul id="dadosCategoria" hidden="hidden">
      <li th:each="c : ${indicadores.porCategoria}" th:attr="data-rotulo=${c.rotulo},data-valor=${c.valor}"></li>
    </ul>
  </div>
  <div class="card grafico"><strong>Totais por prioridade</strong>
    <div class="grafico-pizza">
      <canvas id="graficoPrioridade" width="320" height="320"></canvas>
      <ul id="legendaPrioridade" class="legenda"></ul>
    </div>
    <!-- Fatias de prioridade: conjunto fixo BAIXA/MEDIA/ALTA/URGENTE vindo do servidor. -->
    <ul id="dadosPrioridade" hidden="hidden">
      <li th:each="p : ${indicadores.porPrioridade}" th:attr="data-rotulo=${p.rotulo},data-valor=${p.valor}"></li>
    </ul>
  </div>
  <script>
    // Graficos de pizza desenhados com JS puro (sem CDN) a partir dos valores do servidor (IndicadoresDTO).
    // Paleta verde reutilizada por todos os graficos.
    (function () {
      var paleta = ['#92d050', '#5f9f2f', '#1f4e2f', '#0b5e20'];

      // Desenha um grafico de pizza no canvas e monta a legenda ao lado.
      // dados: lista de {rotulo, valor, cor}. Fatias comecam no topo (-90 graus).
      function desenharPizza(canvas, legendaEl, dados) {
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var total = dados.reduce(function (s, d) { return s + d.valor; }, 0);
        var larg = canvas.width, alt = canvas.height;
        var cx = larg / 2, cy = alt / 2, raio = Math.min(larg, alt) / 2 - 10;
        ctx.clearRect(0, 0, larg, alt);
        if (total <= 0) {
          // Sem dados: circulo cinza com rotulo central.
          ctx.beginPath(); ctx.arc(cx, cy, raio, 0, Math.PI * 2); ctx.fillStyle = '#e0e0e0'; ctx.fill();
          ctx.fillStyle = '#222'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
          ctx.fillText('Sem dados', cx, cy);
        } else {
          // Cada fatia ocupa um angulo proporcional ao seu valor.
          var inicio = -Math.PI / 2;
          dados.forEach(function (d) {
            if (d.valor <= 0) return;
            var angulo = d.valor / total * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, raio, inicio, inicio + angulo); ctx.closePath();
            ctx.fillStyle = d.cor; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            inicio += angulo;
          });
        }
        // Legenda com rotulo, valor absoluto e percentual de cada fatia.
        if (legendaEl) {
          dados.forEach(function (d) {
            var pct = total > 0 ? (d.valor / total * 100) : 0;
            var li = document.createElement('li');
            var cor = document.createElement('span'); cor.className = 'cor'; cor.style.backgroundColor = d.cor;
            li.appendChild(cor);
            li.appendChild(document.createTextNode(d.rotulo + ': ' + d.valor + ' (' + pct.toFixed(1) + '%)'));
            legendaEl.appendChild(li);
          });
        }
      }

      // Le as fatias dinamicas de uma lista oculta, ciclando a paleta verde por item.
      function lerFatias(idDados) {
        var fonte = document.getElementById(idDados);
        if (!fonte) return [];
        var itens = fonte.querySelectorAll('li');
        var fatias = [];
        for (var i = 0; i < itens.length; i++) {
          fatias.push({
            rotulo: itens[i].dataset.rotulo || '',
            valor: +itens[i].dataset.valor || 0,
            cor: paleta[i % paleta.length]
          });
        }
        return fatias;
      }

      // Grafico de status: valores fixos lidos dos atributos data-* do canvas.
      var canvasStatus = document.getElementById('graficoStatus');
      if (canvasStatus) {
        desenharPizza(canvasStatus, document.getElementById('legendaStatus'), [
          { rotulo: 'Abertos', valor: +canvasStatus.dataset.abertos || 0, cor: paleta[0] },
          { rotulo: 'Em análise', valor: +canvasStatus.dataset.emanalise || 0, cor: paleta[1] },
          { rotulo: 'Concluídos', valor: +canvasStatus.dataset.concluidos || 0, cor: paleta[2] },
          { rotulo: 'Cancelados', valor: +canvasStatus.dataset.cancelados || 0, cor: paleta[3] }
        ]);
      }

      // Grafico de categoria: lista dinamica (texto livre), uma cor verde por categoria.
      desenharPizza(document.getElementById('graficoCategoria'),
        document.getElementById('legendaCategoria'), lerFatias('dadosCategoria'));

      // Grafico de prioridade: conjunto fixo BAIXA/MEDIA/ALTA/URGENTE na mesma paleta.
      desenharPizza(document.getElementById('graficoPrioridade'),
        document.getElementById('legendaPrioridade'), lerFatias('dadosPrioridade'));
    })();
  </script>
</body>

</html>
