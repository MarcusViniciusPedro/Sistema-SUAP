<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do chamado</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Detalhes do chamado</h1>

<p>
    <a href="/chamados">Voltar para a lista</a>
</p>

<div class="card">
    <p><strong>ID:</strong> <span th:text="${chamado.id}">1</span></p>
    <p><strong>Título:</strong> <span th:text="${chamado.titulo}">Título</span></p>
    <p><strong>Descrição:</strong> <span th:text="${chamado.descricao}">Descrição</span></p>
    <p><strong>Categoria:</strong> <span th:text="${chamado.categoria}">Categoria</span></p>
    <p><strong>Status:</strong> <span th:text="${chamado.status}">Status</span></p>
    <p><strong>Prioridade:</strong> <span th:text="${chamado.prioridade}">Prioridade</span></p>
    <p><strong>Responsável:</strong> <span th:text="${chamado.responsavel}">Responsável</span></p>
    <p><strong>Data de abertura:</strong> <span th:text="${chamado.dataAbertura}">Data</span></p>
    <p><strong>Data de atualização:</strong> <span th:text="${chamado.dataAtualizacao}">Data</span></p>
    <p><strong>Observação:</strong> <span th:text="${chamado.observacaoAtendimento}">Observação</span></p>
</div>

<p>
    <a th:href="@{/chamados/status/{id}(id=${chamado.id})}">Atualizar status deste chamado</a>
</p>

</body>
</html>
