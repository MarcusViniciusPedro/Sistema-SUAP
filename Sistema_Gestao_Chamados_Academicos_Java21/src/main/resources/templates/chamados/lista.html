<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Chamados</title><link rel="stylesheet" href="/css/style.css"></head><body><header><h1>Sistema de Gestão de Chamados Acadêmicos</h1><nav><a href="/chamados">Chamados</a><a href="/chamados/novo">Novo chamado</a><a href="/indicadores">Indicadores</a><a href="/relatorios">Relatórios</a><form action="/logout" method="post"><button>Sair</button></form></nav></header><p class="mensagem-sucesso" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p><p class="mensagem-erro" th:if="${mensagemErro}" th:text="${mensagemErro}"></p><h2>Consulta de chamados</h2><form method="get" action="/chamados"><div class="filtros card"><label>Busca no título/descrição<input name="busca" th:value="${filtro.busca}"></label>
<label>Status<select name="status"><option value="">Todos</option><option value="ABERTO" th:selected="${filtro.status == 'ABERTO'}">ABERTO</option><option value="EM_ANALISE" th:selected="${filtro.status == 'EM_ANALISE'}">EM_ANALISE</option><option value="CONCLUIDO" th:selected="${filtro.status == 'CONCLUIDO'}">CONCLUIDO</option><option value="CANCELADO" th:selected="${filtro.status == 'CANCELADO'}">CANCELADO</option></select></label>
<label>Categoria<select name="categoria"><option value="">Todas</option><option value="Suporte técnico" th:selected="${filtro.categoria == 'Suporte técnico'}">Suporte técnico</option><option value="Documentos" th:selected="${filtro.categoria == 'Documentos'}">Documentos</option><option value="Matrícula" th:selected="${filtro.categoria == 'Matrícula'}">Matrícula</option><option value="Atendimento acadêmico" th:selected="${filtro.categoria == 'Atendimento acadêmico'}">Atendimento acadêmico</option></select></label>
<label>Prioridade<select name="prioridade"><option value="">Todas</option><option value="BAIXA" th:selected="${filtro.prioridade == 'BAIXA'}">BAIXA</option><option value="MEDIA" th:selected="${filtro.prioridade == 'MEDIA'}">MEDIA</option><option value="ALTA" th:selected="${filtro.prioridade == 'ALTA'}">ALTA</option><option value="URGENTE" th:selected="${filtro.prioridade == 'URGENTE'}">URGENTE</option></select></label>
<label>De<input type="date" name="inicio" th:value="${filtro.inicio}"></label><label>Até<input type="date" name="fim" th:value="${filtro.fim}"></label>
<button type="submit">Aplicar filtros</button><a href="/chamados">Limpar</a></div></form><table><thead><tr><th>ID</th><th>Título</th><th>Categoria</th><th>Status</th><th>Prioridade</th><th>Responsável</th><th>Ações</th></tr></thead>
<tbody><tr th:each="chamado : ${chamados}"><td th:text="${chamado.id}"></td><td th:text="${chamado.titulo}"></td><td th:text="${chamado.categoria}"></td><td th:text="${chamado.status}"></td><td th:text="${chamado.prioridade}"></td><td th:text="${chamado.responsavel}"></td>
<td class="acoes"><a th:href="@{/chamados/detalhes/{id}(id=${chamado.id})}">Detalhes</a> <a th:href="@{/chamados/editar/{id}(id=${chamado.id})}">Editar</a> <a th:href="@{/chamados/status/{id}(id=${chamado.id})}">Status</a>
<form th:action="@{/chamados/excluir/{id}(id=${chamado.id})}" method="post" onsubmit="return confirm('Excluir este chamado?');"><button class="btn-link">Excluir</button></form></td></tr></tbody></table>
<p th:if="${#lists.isEmpty(chamados)}">Nenhum chamado encontrado para os filtros informados.</p></body></html>
